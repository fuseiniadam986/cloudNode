<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudNode</title><link rel="stylesheet" href="/static/app.css"></head><body>
<aside><div class="brand">☁ <b>CloudNode</b><small>简单 · 稳定 · 高效</small></div><nav><a>⌂ 首页</a><a class="on">▣ 节点</a><a onclick="showSub()">▤ 订阅</a><a onclick="showLogs()">▧ 日志</a><a onclick="backupNow()">▥ 备份</a></nav><footer id="ver">v0.3.0-beta</footer></aside>
<main><header><div><h1>节点管理</h1><p>创建和管理 CloudNode 节点</p></div><div><button onclick="serviceAction('restart')">重启 Xray</button><a href="/logout">退出</a></div></header>
<div class="summary"><b id="run">读取状态…</b><span id="num">0 个节点</span><span id="bbr">BBR: -</span><span id="tls">HTTPS: -</span></div>
<section><div class="toolbar"><button class="primary" onclick="showAdd()">＋ 添加节点</button><button onclick="showSub()">订阅地址</button><button onclick="showLogs()">查看日志</button><input id="search" placeholder="搜索节点名称或域名…" oninput="render()"><button onclick="loadState()">刷新</button></div>
<table><thead><tr><th>ID</th><th>节点名称</th><th>状态</th><th>地址</th><th>端口</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<div id="modal" class="modal"><div class="dialog"><button class="close" onclick="hideNodeModal()">×</button><h2 id="modalTitle">添加节点</h2><div class="tip"><b>快速创建（推荐）</b><br>UUID、XHTTP 路径等参数自动生成。</div>
<label>节点名称<input id="name" placeholder="例如：节点01"></label><label>域名 / IP<input id="host" placeholder="node.example.com"></label><label>端口<input id="port" type="number" value="443"></label><label>启用节点<select id="enabled"><option value="1">启用</option><option value="0">停用</option></select></label>
<div class="scheme"><b>配置方案</b><span>● 推荐配置</span><small>VLESS + XHTTP；Beta 默认方案</small></div>
<div class="actions"><button onclick="hideNodeModal()">取消</button><button class="primary" onclick="saveNode()">保存</button></div></div></div>
<div id="shareModal" class="modal"><div class="dialog"><button class="close" onclick="shareModal.classList.remove('show')">×</button><h2>节点配置</h2><textarea id="shareText" readonly></textarea><div class="qrbox"><img id="qrImg" alt="节点二维码"></div><div class="actions"><button onclick="copyText(shareText.value)">复制链接</button></div></div></div>
<div id="subModal" class="modal"><div class="dialog"><button class="close" onclick="subModal.classList.remove('show')">×</button><h2>订阅地址</h2><textarea id="subText" readonly></textarea><p class="muted">订阅内容为 Base64 编码的 VLESS 链接列表，仅包含已启用节点。</p><div class="actions"><button onclick="copyText(subText.value)">复制订阅</button></div></div></div>
<div id="logModal" class="modal"><div class="dialog wide"><button class="close" onclick="logModal.classList.remove('show')">×</button><h2>运行日志</h2><div class="toolbar compact"><button onclick="showLogs('cloudnode-panel')">面板</button><button onclick="showLogs('xray')">Xray</button><button onclick="showLogs('caddy')">Caddy</button></div><pre id="logText"></pre></div></div>
<div id="toasts"></div>
<script src="/static/app.js"></script></body></html>
